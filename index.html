<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレーディア新聞 バックナンバー</title>
<style>
/* トレーディア新聞 共通の紙面デザイン */

:root {
  --paper: #f4ecd8;
  --paper-dark: #e9dcbc;
  --ink: #2b2b2b;
  --ink-soft: #555;
  --accent: #8c2d19;
  --sea: #1f5f7a;
  --rule: #2b2b2b;
  --mincho: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS PMincho", serif;
  --gothic: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 32px 16px;
  background: #5a5248;
  color: var(--ink);
  font-family: var(--mincho);
  font-size: 15px;
  line-height: 1.75;
}

.paper {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 36px 36px;
  background: var(--paper);
  box-shadow: 0 6px 30px rgba(0, 0, 0, .45);
}

img { max-width: 100%; display: block; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 14px 0; }
p { margin: 0 0 .6em; text-align: justify; text-indent: 1em; }
p.noindent, .lead, figcaption, .brief p, .byline { text-indent: 0; }

/* ---------- 題字 ---------- */

.masthead {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  border-bottom: 5px double var(--rule);
  padding-bottom: 10px;
}
.masthead .title {
  font-family: var(--mincho);
  font-weight: 900;
  font-size: 64px;
  letter-spacing: .12em;
  line-height: 1;
  text-align: center;
}
.masthead .title small {
  display: block;
  font-size: 13px;
  letter-spacing: .5em;
  margin-top: 8px;
  font-weight: 600;
}
.masthead .issue, .masthead .date { font-size: 13px; line-height: 1.6; }
.masthead .date { text-align: right; }
.masthead .edition {
  display: inline-block;
  font-family: var(--gothic);
  font-weight: 700;
  color: var(--paper);
  background: var(--accent);
  padding: 2px 10px;
  margin-bottom: 4px;
  letter-spacing: .2em;
}
.ticker {
  font-family: var(--gothic);
  font-size: 12.5px;
  border-bottom: 1px solid var(--rule);
  padding: 4px 0;
  margin-bottom: 18px;
  display: flex;
  gap: 1.5em;
  flex-wrap: wrap;
}
.ticker b { color: var(--accent); }

/* ---------- 面 ---------- */

.page { margin-bottom: 28px; }
.page + .page { border-top: 3px solid var(--rule); padding-top: 14px; }
.page-name {
  font-family: var(--gothic);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .3em;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.page-name::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.page-name .tag { background: var(--ink); color: var(--paper); padding: 1px 10px; }
.page-name .note { font-weight: 400; letter-spacing: .05em; color: var(--ink-soft); }

/* 12列の格子。記事に span-N を付けて幅を決める */
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 18px 24px;
}
.grid > * { grid-column: span 12; min-width: 0; }
.span-3 { grid-column: span 3 !important; }
.span-4 { grid-column: span 4 !important; }
.span-5 { grid-column: span 5 !important; }
.span-6 { grid-column: span 6 !important; }
.span-7 { grid-column: span 7 !important; }
.span-8 { grid-column: span 8 !important; }
.span-9 { grid-column: span 9 !important; }
.ruled-left { border-left: 1px solid var(--rule); padding-left: 22px; }

/* 本文を段組みにする */
.cols-2, .cols-3, .cols-4 { column-gap: 22px; column-rule: 1px solid #b9ad92; }
.cols-2 { columns: 2; }
.cols-3 { columns: 3; }
.cols-4 { columns: 4; }
.cols-2 h3, .cols-3 h3, .cols-4 h3, .cols-2 figure, .cols-3 figure, .cols-4 figure { break-inside: avoid; }

/* ---------- 見出し ---------- */

.kicker {
  font-family: var(--gothic);
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: .1em;
  margin-bottom: 2px;
}
.headline {
  font-family: var(--gothic);
  font-weight: 900;
  font-size: 40px;
  line-height: 1.25;
  margin: 0 0 6px;
  letter-spacing: .02em;
}
.headline.xl { font-size: 52px; }
.subhead {
  font-family: var(--gothic);
  font-weight: 700;
  font-size: 21px;
  line-height: 1.4;
  margin: 0 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
article h2 {
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 24px;
  line-height: 1.3;
  margin: 0 0 8px;
}
article h3 {
  font-family: var(--gothic);
  font-weight: 700;
  font-size: 15.5px;
  margin: .9em 0 .3em;
  padding-left: 8px;
  border-left: 4px solid var(--ink);
}
.lead { font-weight: 700; font-size: 16px; }
.lead .dateline { font-family: var(--gothic); }

/* 白抜きの見出し（号外調・特集） */
.banner {
  font-family: var(--gothic);
  font-weight: 900;
  background: var(--ink);
  color: var(--paper);
  padding: 6px 14px;
  font-size: 30px;
  line-height: 1.25;
  margin: 0 0 10px;
}

/* ---------- 図版 ---------- */

figure { margin: 0 0 12px; }
figure img { border: 1px solid var(--rule); }
figcaption {
  font-family: var(--gothic);
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-soft);
  margin-top: 4px;
}
figcaption::before { content: "▲"; margin-right: .2em; }

/* ---------- 囲み・コラム ---------- */

.box {
  border: 2px solid var(--ink);
  padding: 12px 16px;
  background: rgba(255, 255, 255, .25);
}
.box.accent { border-color: var(--accent); }
.column-title {
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 15px;
  background: var(--ink);
  color: var(--paper);
  display: inline-block;
  padding: 1px 10px;
  margin-bottom: 8px;
}
.byline {
  font-family: var(--gothic);
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.byline b { color: var(--ink); font-size: 14px; }
blockquote {
  margin: .6em 0;
  padding: 6px 14px;
  border-left: 3px solid var(--accent);
  font-size: 15.5px;
}
.poem { white-space: pre-line; text-indent: 0; font-size: 15.5px; line-height: 2; text-align: left; }

/* ---------- 表 ---------- */

table.data {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--gothic);
  font-size: 13px;
  margin: 6px 0 10px;
}
table.data caption { text-align: left; font-weight: 700; margin-bottom: 4px; }
table.data th, table.data td { padding: 3px 6px; border-bottom: 1px solid #b9ad92; }
table.data thead th { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); text-align: left; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.hl td { background: rgba(140, 45, 25, .08); font-weight: 700; }

/* ---------- 短信・予定表 ---------- */

.brief .item { margin-bottom: 8px; }
.brief .item b { font-family: var(--gothic); }
.brief .item b::before { content: "◆"; color: var(--accent); margin-right: .2em; }
.schedule { list-style: none; padding: 0; margin: 0; font-family: var(--gothic); font-size: 13.5px; }
.schedule li { padding: 4px 0; border-bottom: 1px dotted var(--ink-soft); display: flex; gap: 10px; }
.schedule li .when { font-weight: 700; min-width: 5.5em; }

/* ---------- 奥付 ---------- */

.colophon {
  border-top: 5px double var(--rule);
  padding-top: 8px;
  font-family: var(--gothic);
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.colophon a { color: inherit; }

/* ---------- バックナンバー ---------- */

.archive { list-style: none; padding: 0; margin: 0; font-family: var(--gothic); }
.archive li { border-bottom: 1px solid #b9ad92; padding: 10px 0; display: grid; grid-template-columns: 11em 1fr; gap: 12px; }
.archive a { color: var(--ink); font-weight: 700; text-decoration: none; }
.archive a:hover { color: var(--accent); }
.archive .top { font-family: var(--mincho); }

/* ---------- 狭い画面・印刷 ---------- */

@media (max-width: 860px) {
  .paper { padding: 18px; }
  .masthead { grid-template-columns: 1fr; text-align: center; }
  .masthead .date { text-align: center; }
  .masthead .title { font-size: 44px; }
  .grid > * { grid-column: span 12 !important; }
  .ruled-left { border-left: 0; padding-left: 0; }
  .cols-3, .cols-4 { columns: 2; }
  .headline, .headline.xl { font-size: 30px; }
}
@media (max-width: 560px) {
  .cols-2, .cols-3, .cols-4 { columns: 1; }
}
@media print {
  body { background: none; padding: 0; }
  .paper { box-shadow: none; max-width: none; }
  .page { break-before: page; }
  .page:first-of-type { break-before: auto; }
  @page { size: A3 portrait; margin: 12mm; }
}
</style>
</head>
<body>
<div class="paper">

<header class="masthead">
  <div class="issue">トレーディア新聞社</div>
  <div class="title">トレーディア新聞<small>BACK NUMBERS</small></div>
  <div class="date">朝刊・夕刊<br>毎日2回発行</div>
</header>

<section class="page">
  <h2 class="page-name"><span class="tag">バックナンバー</span></h2>
  <ul class="archive">
    <li><a href="issues/107-夕刊.html">第107期 夕刊</a><span class="top">黒潮自治国、首都陥落の翌期に遷都</span></li>
  </ul>
</section>

<footer class="colophon">
  <span>トレーディア新聞</span>
  <span>各国政府・軍の発表をもとに編集</span>
</footer>

</div>
</body>
</html>
