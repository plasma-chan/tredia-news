<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレーディア新聞 バックナンバー</title>
<style>
/* トレーディア新聞 ── 毎日新聞などに近い「1枚の紙面」縦書き */

:root {
  --paper: #f6f0e4;
  --paper-ad: #fffcf5;
  --ink: #111;
  --ink-soft: #444;
  --accent: #b10c0c;
  --rule: #222;
  --rule-soft: #aaa;
  --sheet-h: 1040px;
  --body-h: 780px;
  --mincho: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS PMincho", serif;
  --gothic: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 12px;
  background: #4a433c;
  color: var(--ink);
  font-family: var(--mincho);
}

.paper {
  max-width: 1080px;
  margin: 0 auto;
}

img { max-width: 100%; display: block; }

/* ===== 創刊の題字（1面の上だけ横書き帯） ===== */

.masthead {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 8px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-bottom: 0;
  padding: 8px 12px 6px;
}
.masthead .title {
  font-weight: 900;
  font-size: 48px;
  letter-spacing: .2em;
  line-height: 1;
  text-align: center;
}
.masthead .title small {
  display: block;
  font-family: var(--gothic);
  font-size: 10px;
  letter-spacing: .5em;
  margin-top: 4px;
  font-weight: 600;
}
.masthead .issue, .masthead .date {
  font-family: var(--gothic);
  font-size: 11px;
  line-height: 1.5;
}
.masthead .date { text-align: right; }
.masthead .edition {
  display: inline-block;
  font-weight: 800;
  color: #fff;
  background: var(--accent);
  padding: 1px 8px;
  margin-bottom: 2px;
  letter-spacing: .2em;
}

.ticker {
  font-family: var(--gothic);
  font-size: 11.5px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-top: 0;
  padding: 3px 10px;
  margin-bottom: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  line-height: 1.55;
}
.ticker b { color: var(--accent); margin-right: .8em; }
.ticker > span + span::before { content: "／"; color: var(--rule-soft); margin: 0 .45em; }

/* ===== 1枚の紙面 ===== */

.page {
  margin: 0 0 18px;
}

.sheet {
  background: var(--paper);
  border: 1px solid var(--rule);
  height: var(--sheet-h);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 3px 18px rgba(0,0,0,.35);
}

.sheet-top {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px;
  border-bottom: 2px solid var(--rule);
  font-family: var(--gothic);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .25em;
}
.sheet-top .tag {
  background: var(--ink);
  color: var(--paper);
  padding: 1px 8px;
  letter-spacing: .2em;
}
.sheet-top .pageno { margin-left: auto; letter-spacing: .05em; color: var(--ink-soft); font-weight: 700; }

.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  direction: rtl; /* 右から左へ読む */
  gap: 0;
  border-bottom: 1px solid var(--rule);
}
.sheet-body > * { direction: ltr; min-width: 0; min-height: 0; }

/* 紙面内の区画を縦線で区切る */
.cell {
  border-left: 1px solid var(--rule);
  padding: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.sheet-body > .cell:last-child { border-left: 0; }

/* ----- 縦書き本文（スクロールしない） ----- */

.v {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  overflow: hidden;
  font-size: 12.5px;
  line-height: 1.95;
  letter-spacing: .04em;
  text-align: justify;
  height: 100%;
}
.v p {
  margin: 0;
  padding-inline-end: .55em;
  text-indent: 1em;
}
.v p.noindent, .v .lead { text-indent: 0; }
.v .lead { font-weight: 700; }
.v .dateline { font-family: var(--gothic); font-weight: 800; }
.v h3 {
  font-family: var(--gothic);
  font-size: 12.5px;
  font-weight: 800;
  margin: 0;
  padding-inline-end: .4em;
  padding-block-start: .3em;
  border-block-start: 3px solid var(--ink);
  letter-spacing: .06em;
}

/* 大きな縦見出し（1面の主役） */
.v-headline {
  writing-mode: vertical-rl;
  font-family: var(--gothic);
  font-weight: 900;
  font-size: 42px;
  line-height: 1.25;
  letter-spacing: .12em;
  margin: 0;
  overflow: hidden;
  height: 100%;
}
.v-kicker {
  writing-mode: vertical-rl;
  font-family: var(--gothic);
  font-size: 13px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: .15em;
  margin: 0 0 0 .35em;
}
.v-sub {
  writing-mode: vertical-rl;
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 18px;
  line-height: 1.4;
  letter-spacing: .08em;
  margin: 0 .2em 0 0;
  overflow: hidden;
  height: 100%;
}
.v-title {
  writing-mode: vertical-rl;
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 18px;
  line-height: 1.35;
  letter-spacing: .08em;
  margin: 0 0 0 .4em;
  flex: 0 0 auto;
  max-height: 100%;
  overflow: hidden;
}

/* 写真は横書き部品 */
.photo {
  writing-mode: horizontal-tb;
  margin: 0;
  flex: 0 0 auto;
}
.photo img {
  width: 100%;
  border: 1px solid var(--rule);
}
.photo figcaption {
  font-family: var(--gothic);
  font-size: 10.5px;
  color: var(--ink-soft);
  margin-top: 2px;
  line-height: 1.35;
}
.photo figcaption::before { content: "▲"; margin-right: .15em; }

/* 横書きの小部品（表・目次・囲み） */
.yoko {
  writing-mode: horizontal-tb;
  font-size: 11.5px;
  line-height: 1.5;
}
.yoko h2 {
  font-family: var(--gothic);
  font-size: 14px;
  font-weight: 800;
  margin: 0 0 6px;
}
.box {
  border: 1px solid var(--ink);
  padding: 6px 8px;
  background: rgba(255,255,255,.28);
  margin-bottom: 8px;
}
.column-title {
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 11px;
  background: var(--ink);
  color: var(--paper);
  display: inline-block;
  padding: 1px 6px;
  margin-bottom: 4px;
  letter-spacing: .12em;
}
.byline {
  font-family: var(--gothic);
  font-size: 11px;
  color: var(--ink-soft);
  margin: 0 0 4px;
  writing-mode: horizontal-tb;
}
.byline b { color: var(--ink); }

table.data {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--gothic);
  font-size: 11px;
  margin: 4px 0 8px;
  writing-mode: horizontal-tb;
}
table.data caption { text-align: left; font-weight: 700; margin-bottom: 2px; }
table.data th, table.data td { padding: 2px 4px; border-bottom: 1px solid var(--rule-soft); }
table.data thead th {
  border-top: 2px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  text-align: left;
  background: rgba(0,0,0,.04);
}
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.hl td { background: rgba(177,12,12,.07); font-weight: 700; }

.toc, .schedule {
  list-style: none;
  padding: 0;
  margin: 0;
  font-family: var(--gothic);
  font-size: 11.5px;
}
.toc li, .schedule li {
  padding: 3px 0;
  border-bottom: 1px dotted var(--rule-soft);
  display: flex;
  gap: 6px;
}
.toc .when, .schedule .when { font-weight: 700; min-width: 3.2em; flex-shrink: 0; }

.brief .item { margin-bottom: 6px; font-size: 12px; }
.brief .item b { font-family: var(--gothic); }
.brief .item b::before { content: "◆"; color: var(--accent); margin-right: .15em; }

.poem {
  writing-mode: vertical-rl;
  white-space: pre-line;
  text-indent: 0;
  line-height: 2.05;
  font-size: 13px;
  height: 100%;
  overflow: hidden;
}

/* ----- 面ごとの区画 ----- */

/* 1面 */
.front {
  grid-template-columns: 168px 1fr 92px;
  grid-template-rows: 1fr;
  height: 100%;
}
.front .rail { /* 右端の目次欄（direction:rtl なので見た目は右） */ }
.front .main {
  display: grid;
  grid-template-columns: 1fr 210px;
  direction: rtl;
  gap: 0;
  padding: 0;
  border-left: 1px solid var(--rule);
}
.front .main > * { direction: ltr; }
.front .head-band {
  display: flex;
  flex-direction: row-reverse;
  padding: 8px 6px;
  border-left: 1px solid var(--rule);
}
.front .story {
  display: flex;
  flex-direction: column;
  padding: 8px;
  overflow: hidden;
}
.front .story .photo { margin-bottom: 8px; }
.front .story .v { flex: 1; height: auto; max-height: 100%; }

/* 2段・3段の汎用 */
.cols-2 {
  grid-template-columns: 1fr 1fr;
  height: 100%;
}
.cols-3 {
  grid-template-columns: 1fr 1fr 1fr;
  height: 100%;
}
.cols-3-rail {
  grid-template-columns: 1fr 1fr 200px;
  height: 100%;
}
.cell.stack {
  display: flex;
  flex-direction: row-reverse;
  gap: 0;
}
.cell.stack .v-title { margin: 0 .15em; }

.split-v {
  display: grid;
  grid-template-rows: 1fr 1fr;
  height: 100%;
  gap: 0;
}
.split-v > * {
  overflow: hidden;
  padding-top: 6px;
}
.split-v > * + * {
  border-top: 1px solid var(--rule);
  padding-top: 8px;
}

/* 図版セル */
.cell.fig {
  display: flex;
  flex-direction: column;
}
.cell.fig .photo { flex: 1; }
.cell.fig .photo img { height: 100%; object-fit: cover; }
.cell.fig .v { flex: 0 0 auto; height: 9.5em; margin-top: 6px; }

/* ===== 広告帯（紙面下） ===== */

.ad-row {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 6px;
  background: var(--paper);
  writing-mode: horizontal-tb;
  direction: ltr;
}
.ad {
  border: 1.5px solid var(--ink);
  background: var(--paper-ad);
  padding: 6px;
  font-family: var(--gothic);
  position: relative;
  min-height: 88px;
  line-height: 1.4;
}
.ad .ad-label {
  position: absolute;
  top: -1px;
  right: 5px;
  font-size: 9px;
  letter-spacing: .15em;
  background: var(--paper-ad);
  padding: 0 3px;
  color: var(--ink-soft);
}
.ad h4 {
  margin: 0 0 3px;
  font-size: 13px;
  font-weight: 800;
  text-align: center;
  letter-spacing: .05em;
}
.ad p {
  margin: 0;
  font-size: 10.5px;
  text-align: center;
  text-indent: 0;
}
.ad img {
  border: 0;
  margin: 0 auto 3px;
  max-height: 52px;
  width: auto;
}
.ad.wide { grid-column: span 2; }
.ad.accent-border { border-color: var(--accent); }
.ad .price { font-weight: 800; color: var(--accent); font-size: 11.5px; margin-top: 2px; text-align: center; }

.colophon {
  max-width: 1080px;
  margin: 0 auto 24px;
  padding: 6px 4px;
  font-family: var(--gothic);
  font-size: 11px;
  color: #ddd;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}
.colophon a { color: #eee; }

.archive {
  list-style: none;
  padding: 0;
  margin: 0;
  font-family: var(--gothic);
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 12px 16px;
}
.archive li {
  border-bottom: 1px solid var(--rule-soft);
  padding: 8px 0;
  display: grid;
  grid-template-columns: 11em 1fr;
  gap: 10px;
}
.archive a { color: var(--ink); font-weight: 700; text-decoration: none; }
.archive a:hover { color: var(--accent); }

/* 狭い画面：紙面を縮小表示（縦書きは維持） */
@media (max-width: 1100px) {
  body { padding: 8px; }
  .paper { max-width: 100%; }
  .sheet {
    height: auto;
    min-height: 0;
    transform-origin: top center;
  }
  .sheet-body {
    height: var(--body-h);
  }
  .front, .cols-2, .cols-3, .cols-3-rail {
    height: var(--body-h);
  }
}
@media (max-width: 720px) {
  /* スマホでは紙面を横スクロールできる台紙として見せる */
  body { overflow-x: auto; }
  .paper { min-width: 980px; }
}

@media print {
  body { background: none; padding: 0; }
  .page { break-after: page; }
  .sheet { box-shadow: none; height: 100vh; }
  @page { size: A3 portrait; margin: 8mm; }
}
</style>
</head>
<body>
<div class="paper">

<header class="masthead">
  <div class="issue">トレーディア新聞社</div>
  <div class="title">トレーディア新聞<small>BACK NUMBERS</small></div>
  <div class="date">朝刊・夕刊<br>毎日2回発行</div>
</header>

<section class="page">
  <h2 class="page-name"><span class="tag">バックナンバー</span></h2>
  <ul class="archive">
    <li><a href="issues/107-夕刊.html">第107期 夕刊</a><span class="top">黒潮自治国、首都陥落の翌期に遷都</span></li>
  </ul>
</section>

<footer class="colophon">
  <span>トレーディア新聞</span>
  <span>各国政府・軍の発表をもとに編集</span>
</footer>

</div>
</body>
</html>
