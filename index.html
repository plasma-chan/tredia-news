<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレーディア新聞 バックナンバー</title>
<style>
/* トレーディア新聞 ── 縦書きの日本の新聞紙面 */

:root {
  --paper: #f7f1e3;
  --paper-ad: #fffdf7;
  --ink: #1a1a1a;
  --ink-soft: #444;
  --accent: #b31b1b;
  --rule: #1a1a1a;
  --rule-soft: #9a917c;
  --v-height: 680px;
  --mincho: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS PMincho", serif;
  --gothic: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px 10px;
  background: #3d3832;
  color: var(--ink);
  font-family: var(--mincho);
  font-size: 14px;
  line-height: 1.9;
}

.paper {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 18px 20px;
  background: var(--paper);
  box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
  writing-mode: horizontal-tb;
}

img { max-width: 100%; display: block; }

/* ---------- 題字・要点・面名は横書き ---------- */

.masthead {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 8px;
  border-top: 4px solid var(--rule);
  border-bottom: 4px solid var(--rule);
  padding: 6px 0 8px;
  position: relative;
  writing-mode: horizontal-tb;
}
.masthead::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 2px;
  border-bottom: 1px solid var(--rule);
}
.masthead .title {
  font-family: var(--mincho);
  font-weight: 900;
  font-size: 58px;
  letter-spacing: .18em;
  line-height: 1;
  text-align: center;
  padding: 0 12px;
}
.masthead .title small {
  display: block;
  font-family: var(--gothic);
  font-size: 11px;
  letter-spacing: .55em;
  margin-top: 6px;
  font-weight: 600;
}
.masthead .issue, .masthead .date {
  font-family: var(--gothic);
  font-size: 12px;
  line-height: 1.55;
}
.masthead .date { text-align: right; }
.masthead .edition {
  display: inline-block;
  font-weight: 800;
  color: #fff;
  background: var(--accent);
  padding: 1px 8px;
  margin-bottom: 3px;
  letter-spacing: .25em;
  font-size: 12px;
}

.ticker {
  font-family: var(--gothic);
  font-size: 12px;
  border-bottom: 2px solid var(--rule);
  padding: 3px 0 4px;
  margin: 0 0 10px;
  display: flex;
  gap: 0;
  flex-wrap: wrap;
  align-items: baseline;
  writing-mode: horizontal-tb;
  line-height: 1.6;
}
.ticker b { color: var(--accent); font-weight: 800; margin-right: 1em; }
.ticker > span + span::before {
  content: "／";
  color: var(--rule-soft);
  margin: 0 .6em;
}

.page {
  margin-bottom: 0;
  padding: 10px 0 12px;
  writing-mode: horizontal-tb;
}
.page + .page {
  border-top: 3px double var(--rule);
  margin-top: 6px;
}
.page-name {
  font-family: var(--gothic);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .35em;
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  writing-mode: horizontal-tb;
}
.page-name .tag {
  background: var(--ink);
  color: var(--paper);
  padding: 2px 10px;
  letter-spacing: .25em;
}
.page-name .pageno {
  font-weight: 700;
  letter-spacing: .05em;
  margin-left: auto;
  color: var(--ink-soft);
}

/* 格子は右から左へ（右が主記事） */
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 12px 16px;
  direction: rtl;
}
.grid > * {
  grid-column: span 12;
  min-width: 0;
  direction: ltr;
}
.span-2 { grid-column: span 2 !important; }
.span-3 { grid-column: span 3 !important; }
.span-4 { grid-column: span 4 !important; }
.span-5 { grid-column: span 5 !important; }
.span-6 { grid-column: span 6 !important; }
.span-7 { grid-column: span 7 !important; }
.span-8 { grid-column: span 8 !important; }
.span-9 { grid-column: span 9 !important; }

/* ---------- 本文は縦書き ---------- */

.page .grid > article,
.page .grid > aside,
.page .grid > div:not(.ad-row) {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  height: var(--v-height);
  overflow-x: auto;
  overflow-y: hidden;
  font-size: 14px;
  line-height: 1.95;
  text-align: justify;
  padding: 0 2px;
}

.ruled-left {
  border-block-start: 1px solid var(--rule);
  padding-block-start: 12px;
}
.ruled-right {
  border-block-end: 1px solid var(--rule);
  padding-block-end: 12px;
}

hr {
  border: 0;
  border-block-start: 1px solid var(--rule);
  margin: 0 .5em;
  block-size: auto;
  inline-size: 100%;
  min-block-size: 3em;
}

p {
  margin: 0;
  padding-inline-end: .7em;
  text-indent: 1em;
}
p.noindent, .lead, figcaption, .brief p, .byline, .ad p, .toc li { text-indent: 0; }

/* 縦書きの中では段組みCSSは使わない（高さで自然に左へ進む） */
.cols-2, .cols-3, .cols-4 {
  columns: unset;
  column-rule: none;
}

.kicker {
  font-family: var(--gothic);
  font-size: 12px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: .12em;
  margin-block-end: .35em;
}
.headline {
  font-family: var(--gothic);
  font-weight: 900;
  font-size: 26px;
  line-height: 1.35;
  margin: 0;
  padding-inline-end: .5em;
  letter-spacing: .08em;
}
.headline.xl { font-size: 32px; letter-spacing: .1em; }
.headline.lg { font-size: 22px; }
.subhead {
  font-family: var(--gothic);
  font-weight: 700;
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
  padding-inline-end: .6em;
  border-block-end: 1px solid var(--rule);
  padding-block-end: .4em;
  margin-block-end: .5em;
}
article h2 {
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 17px;
  line-height: 1.4;
  margin: 0;
  padding-inline-end: .45em;
  letter-spacing: .06em;
}
article h3 {
  font-family: var(--gothic);
  font-weight: 700;
  font-size: 13.5px;
  margin: 0;
  padding-inline-end: .4em;
  padding-block-start: .35em;
  border-block-start: 3px solid var(--ink);
  letter-spacing: .04em;
}
.lead { font-weight: 700; font-size: 14.5px; }
.lead .dateline { font-family: var(--gothic); font-weight: 800; }
.banner {
  font-family: var(--gothic);
  font-weight: 900;
  background: var(--ink);
  color: var(--paper);
  padding: .4em .5em;
  font-size: 18px;
  line-height: 1.35;
  margin: 0;
  padding-inline-end: .5em;
}

/* 図版・表・囲みは横書き部品として差し込む */
figure {
  writing-mode: horizontal-tb;
  width: 220px;
  margin: 0 .7em .2em 0;
  display: inline-block;
  vertical-align: top;
}
figure.float-left, figure.float-right {
  float: none;
  width: 240px;
}
figure img { border: 1px solid var(--rule); width: 100%; }
figcaption {
  font-family: var(--gothic);
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink-soft);
  margin-top: 2px;
  writing-mode: horizontal-tb;
}
figcaption::before { content: "▲"; margin-right: .15em; }

.box {
  writing-mode: horizontal-tb;
  border: 1px solid var(--ink);
  padding: 8px 10px;
  background: rgba(255, 255, 255, .22);
  width: 240px;
  margin: 0 .6em .3em 0;
  display: inline-block;
  vertical-align: top;
  line-height: 1.6;
  font-size: 13px;
}
.box.accent { border: 2px solid var(--accent); }
.column-title {
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 12px;
  background: var(--ink);
  color: var(--paper);
  display: inline-block;
  padding: 1px 8px;
  margin-bottom: 5px;
  letter-spacing: .12em;
}
.byline {
  font-family: var(--gothic);
  font-size: 11.5px;
  color: var(--ink-soft);
  margin: 0;
  padding-inline-end: .4em;
}
.byline b { color: var(--ink); font-size: 12.5px; }
blockquote {
  margin: 0;
  padding-block-start: .5em;
  border-block-start: 3px solid var(--accent);
  font-size: 14px;
  padding-inline-end: .5em;
}
.poem {
  white-space: pre-line;
  text-indent: 0;
  font-size: 14px;
  line-height: 2.1;
  text-align: start;
  padding-inline-end: .5em;
}

table.data {
  writing-mode: horizontal-tb;
  width: 250px;
  border-collapse: collapse;
  font-family: var(--gothic);
  font-size: 11.5px;
  margin: 0 .6em .4em 0;
  display: inline-table;
  vertical-align: top;
  line-height: 1.45;
}
table.data caption { text-align: left; font-weight: 700; margin-bottom: 2px; font-size: 12px; }
table.data th, table.data td { padding: 2px 5px; border-bottom: 1px solid var(--rule-soft); }
table.data thead th {
  border-top: 2px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  text-align: left;
  background: rgba(0, 0, 0, .04);
}
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.hl td { background: rgba(179, 27, 27, .07); font-weight: 700; }

.brief .item { margin: 0; padding-inline-end: .55em; font-size: 13px; }
.brief .item b { font-family: var(--gothic); font-size: 13px; }
.brief .item b::before { content: "◆"; color: var(--accent); margin-right: .15em; }

.schedule, .toc {
  list-style: none;
  padding: 0;
  margin: 0;
  font-family: var(--gothic);
  font-size: 12px;
  writing-mode: horizontal-tb;
  width: 240px;
  display: inline-block;
  vertical-align: top;
  line-height: 1.5;
}
.schedule li, .toc li {
  padding: 3px 0;
  border-bottom: 1px dotted var(--rule-soft);
  display: flex;
  gap: 8px;
}
.schedule li .when, .toc li .when { font-weight: 700; min-width: 5em; flex-shrink: 0; }

/* ---------- 広告は横書き帯 ---------- */

.ad-row {
  writing-mode: horizontal-tb;
  direction: ltr;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 2px solid var(--rule);
  grid-column: 1 / -1 !important;
  height: auto !important;
  overflow: visible !important;
}
.ad {
  border: 2px solid var(--ink);
  background: var(--paper-ad);
  padding: 8px;
  font-family: var(--gothic);
  position: relative;
  min-height: 120px;
  writing-mode: horizontal-tb;
  line-height: 1.45;
}
.ad .ad-label {
  position: absolute;
  top: -1px;
  right: 6px;
  font-size: 9px;
  letter-spacing: .2em;
  background: var(--paper-ad);
  padding: 0 4px;
  color: var(--ink-soft);
}
.ad h4 {
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .06em;
  text-align: center;
  line-height: 1.3;
}
.ad p {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.45;
  text-align: center;
  text-indent: 0;
  padding-inline-end: 0;
}
.ad img {
  border: 0;
  margin: 0 auto 5px;
  max-height: 90px;
  width: auto;
}
.ad.tall { min-height: 180px; }
.ad.wide { grid-column: span 2; }
.ad.accent-border { border-color: var(--accent); }
.ad .price {
  font-weight: 800;
  color: var(--accent);
  font-size: 13px;
  margin-top: 3px;
}

.colophon {
  border-top: 4px solid var(--rule);
  margin-top: 8px;
  padding-top: 6px;
  font-family: var(--gothic);
  font-size: 11px;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
  writing-mode: horizontal-tb;
  line-height: 1.5;
}
.colophon a { color: inherit; }

.archive { list-style: none; padding: 0; margin: 0; font-family: var(--gothic); writing-mode: horizontal-tb; }
.archive li {
  border-bottom: 1px solid var(--rule-soft);
  padding: 8px 0;
  display: grid;
  grid-template-columns: 11em 1fr;
  gap: 10px;
  line-height: 1.5;
}
.archive a { color: var(--ink); font-weight: 700; text-decoration: none; }
.archive a:hover { color: var(--accent); }
.archive .top { font-family: var(--mincho); }

/* 狭い画面は横書きに戻す（読みやすさ優先） */
@media (max-width: 960px) {
  .paper { padding: 12px; }
  .masthead { grid-template-columns: 1fr; text-align: center; }
  .masthead .date { text-align: center; }
  .masthead .title { font-size: 40px; }
  .grid { direction: ltr; }
  .grid > * { grid-column: span 12 !important; }
  .page .grid > article,
  .page .grid > aside,
  .page .grid > div:not(.ad-row) {
    writing-mode: horizontal-tb;
    height: auto;
    overflow: visible;
    line-height: 1.7;
  }
  .ruled-left { border: 0; border-left: 1px solid var(--rule); padding: 0 0 0 12px; }
  .ruled-right { border: 0; border-right: 1px solid var(--rule); padding: 0 12px 0 0; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 8px 0; min-block-size: 0; }
  p { padding-inline-end: 0; margin: 0 0 .45em; }
  figure, figure.float-left, figure.float-right, .box, table.data, .schedule, .toc {
    width: 100%;
    display: block;
    margin: 0 0 8px;
  }
  .headline.xl { font-size: 26px; }
  .ad-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .ad-row { grid-template-columns: 1fr; }
}
@media print {
  body { background: none; padding: 0; }
  .paper { box-shadow: none; max-width: none; }
  .page { break-before: page; }
  .page:first-of-type { break-before: auto; }
  @page { size: A3 portrait; margin: 10mm; }
}
</style>
</head>
<body>
<div class="paper">

<header class="masthead">
  <div class="issue">トレーディア新聞社</div>
  <div class="title">トレーディア新聞<small>BACK NUMBERS</small></div>
  <div class="date">朝刊・夕刊<br>毎日2回発行</div>
</header>

<section class="page">
  <h2 class="page-name"><span class="tag">バックナンバー</span></h2>
  <ul class="archive">
    <li><a href="issues/107-夕刊.html">第107期 夕刊</a><span class="top">黒潮自治国、首都陥落の翌期に遷都</span></li>
  </ul>
</section>

<footer class="colophon">
  <span>トレーディア新聞</span>
  <span>各国政府・軍の発表をもとに編集</span>
</footer>

</div>
</body>
</html>
