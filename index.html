<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレーディア新聞 バックナンバー</title>
<style>
/* トレーディア新聞 ── 日本の新聞に近い密な紙面 */

:root {
  --paper: #f7f1e3;
  --paper-ad: #fffdf7;
  --ink: #1a1a1a;
  --ink-soft: #444;
  --accent: #b31b1b;
  --rule: #1a1a1a;
  --rule-soft: #9a917c;
  --mincho: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS PMincho", serif;
  --gothic: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px 10px;
  background: #3d3832;
  color: var(--ink);
  font-family: var(--mincho);
  font-size: 13.5px;
  line-height: 1.65;
}

.paper {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 18px 20px;
  background: var(--paper);
  box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
}

img { max-width: 100%; display: block; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 8px 0; }
p { margin: 0 0 .45em; text-align: justify; text-indent: 1em; }
p.noindent, .lead, figcaption, .brief p, .byline, .ad p, .toc li { text-indent: 0; }

/* ---------- 題字（日本の紙面みたく、太い罫で区切る） ---------- */

.masthead {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 8px;
  border-top: 4px solid var(--rule);
  border-bottom: 4px solid var(--rule);
  padding: 6px 0 8px;
  position: relative;
}
.masthead::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 2px;
  border-bottom: 1px solid var(--rule);
}
.masthead .title {
  font-family: var(--mincho);
  font-weight: 900;
  font-size: 58px;
  letter-spacing: .18em;
  line-height: 1;
  text-align: center;
  padding: 0 12px;
}
.masthead .title small {
  display: block;
  font-family: var(--gothic);
  font-size: 11px;
  letter-spacing: .55em;
  margin-top: 6px;
  font-weight: 600;
}
.masthead .issue, .masthead .date {
  font-family: var(--gothic);
  font-size: 12px;
  line-height: 1.55;
}
.masthead .date { text-align: right; }
.masthead .edition {
  display: inline-block;
  font-weight: 800;
  color: #fff;
  background: var(--accent);
  padding: 1px 8px;
  margin-bottom: 3px;
  letter-spacing: .25em;
  font-size: 12px;
}

.ticker {
  font-family: var(--gothic);
  font-size: 12px;
  border-bottom: 2px solid var(--rule);
  padding: 3px 0 4px;
  margin: 0 0 10px;
  display: flex;
  gap: 1.2em;
  flex-wrap: wrap;
  align-items: baseline;
}
.ticker b { color: var(--accent); font-weight: 800; }
.ticker span + span::before {
  content: "／";
  color: var(--rule-soft);
  margin-right: 1.2em;
}

/* ---------- 面 ---------- */

.page {
  margin-bottom: 0;
  padding: 10px 0 12px;
  position: relative;
}
.page + .page {
  border-top: 3px double var(--rule);
  margin-top: 6px;
}
.page-name {
  font-family: var(--gothic);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .35em;
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.page-name .tag {
  background: var(--ink);
  color: var(--paper);
  padding: 2px 10px;
  letter-spacing: .25em;
}
.page-name .pageno {
  font-weight: 700;
  letter-spacing: .05em;
  margin-left: auto;
  color: var(--ink-soft);
}
.page-name::after { content: none; }

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 10px 14px;
}
.grid > * { grid-column: span 12; min-width: 0; }
.span-2 { grid-column: span 2 !important; }
.span-3 { grid-column: span 3 !important; }
.span-4 { grid-column: span 4 !important; }
.span-5 { grid-column: span 5 !important; }
.span-6 { grid-column: span 6 !important; }
.span-7 { grid-column: span 7 !important; }
.span-8 { grid-column: span 8 !important; }
.span-9 { grid-column: span 9 !important; }
.ruled-left { border-left: 1px solid var(--rule); padding-left: 12px; }
.ruled-right { border-right: 1px solid var(--rule); padding-right: 12px; }

.cols-2, .cols-3, .cols-4 {
  column-gap: 14px;
  column-rule: 1px solid var(--rule-soft);
}
.cols-2 { columns: 2; }
.cols-3 { columns: 3; }
.cols-4 { columns: 4; }
.cols-2 h3, .cols-3 h3, .cols-4 h3,
.cols-2 figure, .cols-3 figure, .cols-4 figure,
.cols-2 .box, .cols-3 .box { break-inside: avoid; }

/* ---------- 見出し ---------- */

.kicker {
  font-family: var(--gothic);
  font-size: 11.5px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: .12em;
  margin-bottom: 1px;
}
.headline {
  font-family: var(--gothic);
  font-weight: 900;
  font-size: 28px;
  line-height: 1.25;
  margin: 0 0 4px;
  letter-spacing: .01em;
}
.headline.xl { font-size: 36px; }
.headline.lg { font-size: 24px; }
.subhead {
  font-family: var(--gothic);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.35;
  margin: 0 0 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--rule);
}
article h2 {
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 17px;
  line-height: 1.3;
  margin: 0 0 5px;
}
article h3 {
  font-family: var(--gothic);
  font-weight: 700;
  font-size: 13px;
  margin: .55em 0 .2em;
  padding-left: 6px;
  border-left: 3px solid var(--ink);
}
.lead { font-weight: 700; font-size: 14px; }
.lead .dateline { font-family: var(--gothic); font-weight: 800; }
.banner {
  font-family: var(--gothic);
  font-weight: 900;
  background: var(--ink);
  color: var(--paper);
  padding: 4px 10px;
  font-size: 20px;
  line-height: 1.25;
  margin: 0 0 8px;
}

/* ---------- 図版 ---------- */

figure { margin: 0 0 8px; }
figure.float-left {
  float: left;
  width: 46%;
  margin: 0 12px 6px 0;
}
figure.float-right {
  float: right;
  width: 46%;
  margin: 0 0 6px 12px;
}
figure img { border: 1px solid var(--rule); width: 100%; }
figcaption {
  font-family: var(--gothic);
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink-soft);
  margin-top: 2px;
}
figcaption::before { content: "▲"; margin-right: .15em; }

/* ---------- 囲み ---------- */

.box {
  border: 1px solid var(--ink);
  padding: 8px 10px;
  background: rgba(255, 255, 255, .22);
}
.box.accent { border: 2px solid var(--accent); }
.column-title {
  font-family: var(--gothic);
  font-weight: 800;
  font-size: 12px;
  background: var(--ink);
  color: var(--paper);
  display: inline-block;
  padding: 1px 8px;
  margin-bottom: 5px;
  letter-spacing: .12em;
}
.byline {
  font-family: var(--gothic);
  font-size: 11.5px;
  color: var(--ink-soft);
  margin-bottom: 5px;
}
.byline b { color: var(--ink); font-size: 12.5px; }
blockquote {
  margin: .4em 0;
  padding: 3px 10px;
  border-left: 3px solid var(--accent);
  font-size: 13.5px;
}
.poem {
  white-space: pre-line;
  text-indent: 0;
  font-size: 13.5px;
  line-height: 1.9;
  text-align: left;
}

/* ---------- 表 ---------- */

table.data {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--gothic);
  font-size: 11.5px;
  margin: 4px 0 8px;
}
table.data caption { text-align: left; font-weight: 700; margin-bottom: 2px; font-size: 12px; }
table.data th, table.data td { padding: 2px 5px; border-bottom: 1px solid var(--rule-soft); }
table.data thead th {
  border-top: 2px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  text-align: left;
  background: rgba(0, 0, 0, .04);
}
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.hl td { background: rgba(179, 27, 27, .07); font-weight: 700; }

/* ---------- 短信・予定・目次 ---------- */

.brief .item { margin-bottom: 5px; font-size: 12.5px; }
.brief .item b { font-family: var(--gothic); font-size: 12.5px; }
.brief .item b::before { content: "◆"; color: var(--accent); margin-right: .15em; }
.schedule, .toc { list-style: none; padding: 0; margin: 0; font-family: var(--gothic); font-size: 12px; }
.schedule li, .toc li {
  padding: 3px 0;
  border-bottom: 1px dotted var(--rule-soft);
  display: flex;
  gap: 8px;
}
.schedule li .when, .toc li .when { font-weight: 700; min-width: 5em; flex-shrink: 0; }

/* ---------- 広告（紙面に載せる営業枠） ---------- */

.ad-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 2px solid var(--rule);
}
.ad {
  border: 2px solid var(--ink);
  background: var(--paper-ad);
  padding: 8px;
  font-family: var(--gothic);
  position: relative;
  min-height: 120px;
}
.ad .ad-label {
  position: absolute;
  top: -1px;
  right: 6px;
  font-size: 9px;
  letter-spacing: .2em;
  background: var(--paper-ad);
  padding: 0 4px;
  color: var(--ink-soft);
}
.ad h4 {
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .06em;
  text-align: center;
  line-height: 1.3;
}
.ad p {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.45;
  text-align: center;
  text-indent: 0;
}
.ad img {
  border: 0;
  margin: 0 auto 5px;
  max-height: 90px;
  width: auto;
}
.ad.tall { min-height: 180px; }
.ad.wide { grid-column: span 2; }
.ad.accent-border { border-color: var(--accent); }
.ad .price {
  font-weight: 800;
  color: var(--accent);
  font-size: 13px;
  margin-top: 3px;
}

/* ---------- 奥付 ---------- */

.colophon {
  border-top: 4px solid var(--rule);
  margin-top: 8px;
  padding-top: 6px;
  font-family: var(--gothic);
  font-size: 11px;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}
.colophon a { color: inherit; }

.archive { list-style: none; padding: 0; margin: 0; font-family: var(--gothic); }
.archive li {
  border-bottom: 1px solid var(--rule-soft);
  padding: 8px 0;
  display: grid;
  grid-template-columns: 11em 1fr;
  gap: 10px;
}
.archive a { color: var(--ink); font-weight: 700; text-decoration: none; }
.archive a:hover { color: var(--accent); }
.archive .top { font-family: var(--mincho); }

@media (max-width: 960px) {
  .paper { padding: 12px; }
  .masthead { grid-template-columns: 1fr; text-align: center; }
  .masthead .date { text-align: center; }
  .masthead .title { font-size: 40px; }
  .grid > * { grid-column: span 12 !important; }
  .ruled-left { border-left: 0; padding-left: 0; }
  .ruled-right { border-right: 0; padding-right: 0; }
  .cols-3, .cols-4 { columns: 2; }
  .headline.xl { font-size: 26px; }
  .ad-row { grid-template-columns: 1fr 1fr; }
  figure.float-left, figure.float-right { float: none; width: 100%; margin: 0 0 8px; }
}
@media (max-width: 560px) {
  .cols-2, .cols-3, .cols-4 { columns: 1; }
  .ad-row { grid-template-columns: 1fr; }
}
@media print {
  body { background: none; padding: 0; }
  .paper { box-shadow: none; max-width: none; }
  .page { break-before: page; }
  .page:first-of-type { break-before: auto; }
  @page { size: A3 portrait; margin: 10mm; }
}
</style>
</head>
<body>
<div class="paper">

<header class="masthead">
  <div class="issue">トレーディア新聞社</div>
  <div class="title">トレーディア新聞<small>BACK NUMBERS</small></div>
  <div class="date">朝刊・夕刊<br>毎日2回発行</div>
</header>

<section class="page">
  <h2 class="page-name"><span class="tag">バックナンバー</span></h2>
  <ul class="archive">
    <li><a href="issues/107-夕刊.html">第107期 夕刊</a><span class="top">黒潮自治国、首都陥落の翌期に遷都</span></li>
  </ul>
</section>

<footer class="colophon">
  <span>トレーディア新聞</span>
  <span>各国政府・軍の発表をもとに編集</span>
</footer>

</div>
</body>
</html>
